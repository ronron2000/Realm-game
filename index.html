<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Realm Game</title><link rel='manifest' href='manifest.json'><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10151c;color:#eee;font:16px system-ui}.app{max-width:760px;margin:auto;padding:12px}.top,.panel{background:#19222d;border:1px solid #334150;border-radius:12px;padding:12px;margin-bottom:10px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.stat{font-size:13px}.bar{height:10px;background:#303945;border-radius:8px;overflow:hidden;margin-top:3px}.fill{height:100%;background:#79b7ff}.energy{background:#ffc857}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tile{min-height:74px;background:#202c38;border:1px solid #405165;color:#ddd;border-radius:8px;padding:6px}.tile.here{outline:2px solid #76b8ff}.tile.locked{opacity:.35}.tile b{display:block}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:9px;background:#316da8;color:white;padding:12px;font-weight:700}button.alt{background:#465361}button:disabled{opacity:.4}.log{height:150px;overflow:auto;background:#0d1218;padding:8px;border-radius:8px;font-size:13px}.loot{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#293747;padding:5px 8px;border-radius:999px;font-size:12px}h2,h3{margin:4px 0 10px}.small{font-size:12px;color:#aab7c5}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:9px}.hidden{display:none}
</style></head><body><div class='app'><div class='top'><div><b>Realm Game</b><div class='small'>Browser RPG prototype</div></div><div class='stat'>Gold: <span id='gold'></span> · Lv <span id='level'></span></div></div>
<div class='panel'><div>HP <span id='hpText'></span><div class='bar'><div id='hpBar' class='fill'></div></div></div><div>Rested Time <span id='restText'></span><div class='bar'><div id='restBar' class='fill energy'></div></div></div></div>
<div class='tabs'><button onclick="tab('world')">World</button><button onclick="tab('craft')">Craft</button><button onclick="tab('upgrade')">Upgrades</button></div>
<section id='world'><div class='panel'><h3>Realm Map</h3><div id='map' class='grid'></div></div><div class='panel'><h3 id='zoneName'></h3><div id='enemy'></div><div class='actions'><button id='fight' onclick='fight()'>Fight Monster</button><button class='alt' onclick='rest()'>Rest</button></div></div></section>
<section id='craft' class='hidden'><div class='panel'><h3>Crafting</h3><p class='small'>Combine monster materials into equipment.</p><div id='recipes'></div></div></section>
<section id='upgrade' class='hidden'><div class='panel'><h3>Permanent Upgrades</h3><div id='upgrades'></div></div></section>
<div class='panel'><h3>Inventory</h3><div id='inventory' class='loot'></div></div><div class='panel'><h3>Adventure Log</h3><div id='log' class='log'></div></div></div>
<script>
const zones=[['Greenhaven',1],['Old Road',2],['Moss Cave',3],['Wolfwood',4],['Sunken Ruins',5],['Ash Fields',6],['Frost Pass',7],['Obsidian Gate',8],['Dragon Reach',10]];
const monsters=['Rat','Goblin','Slime','Wolf','Bandit','Wraith','Ice Golem','Demon','Drake'];
let s=JSON.parse(localStorage.realmSave||'null')||{level:1,xp:0,hp:100,maxHp:100,gold:25,zone:0,rested:100,maxRested:100,inv:{Wood:2,Ore:1},virtue:0,accel:0,doubleAccel:0,last:Date.now()};
let elapsed=Math.floor((Date.now()-s.last)/60000); s.rested=Math.min(s.maxRested,s.rested+elapsed); s.last=Date.now();
function save(){s.last=Date.now();localStorage.realmSave=JSON.stringify(s)} function log(t){let e=document.getElementById('log');e.innerHTML=t+'<br>'+e.innerHTML}
function add(i,n=1){s.inv[i]=(s.inv[i]||0)+n} function need(obj){return Object.entries(obj).every(([k,v])=>(s.inv[k]||0)>=v)} function spend(obj){for(let k in obj)s.inv[k]-=obj[k]}
function tab(n){for(let id of ['world','craft','upgrade'])document.getElementById(id).classList.toggle('hidden',id!==n);render()}
function render(){gold.textContent=s.gold;level.textContent=s.level;hpText.textContent=`${s.hp}/${s.maxHp}`;hpBar.style.width=100*s.hp/s.maxHp+'%';restText.textContent=`${s.rested}/${s.maxRested}`;restBar.style.width=100*s.rested/s.maxRested+'%';zoneName.textContent=zones[s.zone][0];enemy.innerHTML=`<p>${monsters[s.zone]} · Level ${zones[s.zone][1]}</p><p class='small'>Battles use rested time. Rare monsters can drop a soulbound Time Card.</p>`;fight.disabled=s.rested<=0||s.hp<=0;
map.innerHTML=zones.map((z,i)=>`<button class='tile ${i===s.zone?'here':''} ${i>s.level?'locked':''}' ${i>s.level?'disabled':''} onclick='s.zone=${i};save();render()'><b>${z[0]}</b>Lv ${z[1]}</button>`).join('');inventory.innerHTML=Object.entries(s.inv).filter(x=>x[1]>0).map(([k,v])=>`<span class='pill'>${k} ×${v}</span>`).join('')||'<span class=small>Empty</span>';renderRecipes();renderUpgrades();save()}
function fight(){if(s.rested<1)return;let z=zones[s.zone][1], haste=1+s.accel*.15+s.doubleAccel*.25, dmg=Math.floor((12+s.level*3+s.virtue*2)*haste),enemyHp=25+z*18, taken=Math.max(1,Math.floor(z*5-Math.random()*5));let hits=Math.ceil(enemyHp/dmg);s.hp-=taken*hits;s.rested=Math.max(0,s.rested-hits);if(s.hp<=0){s.hp=1;s.gold=Math.max(0,s.gold-10);log('You were defeated and lost 10 gold.');render();return}let g=4+z*3;s.gold+=g;s.xp+=8+z*4;add(Math.random()<.5?'Wood':'Ore');if(Math.random()<.15)add('Trophy');if(Math.random()<.025){add('Soulbound Time Card');s.rested=Math.min(s.maxRested,s.rested+50);log('RARE DROP: Soulbound Time Card! +50 rested time.')}log(`Defeated ${monsters[s.zone]} in ${hits} hit(s). +${g} gold.`);while(s.xp>=s.level*40){s.xp-=s.level*40;s.level++;s.maxHp+=10;s.hp=s.maxHp;log('Level up! You are now level '+s.level+'.')}render()}
function rest(){s.hp=s.maxHp;log('You rest and recover your HP.');render()}
const rec=[['Iron Blade',{Wood:2,Ore:4}],['Hunter Charm',{Wood:4,Trophy:2}],['Realm Trophy',{Ore:5,Trophy:5}]];function renderRecipes(){recipes.innerHTML=rec.map(([n,c])=>`<div class='panel'><b>${n}</b><div class=small>${Object.entries(c).map(x=>x.join(' ×')).join(', ')}</div><button ${need(c)?'':'disabled'} onclick='craft(${JSON.stringify(n)})'>Craft</button></div>`).join('')}function craft(n){let r=rec.find(x=>x[0]===n);if(need(r[1])){spend(r[1]);add(n);log('Crafted '+n+'.');render()}}
function renderUpgrades(){let ups=[['Virtue','virtue',100,'+2 base damage'],['Acceleration','accel',200,'+15% combat speed'],['Double Accel','doubleAccel',500,'+25% combat speed']];upgrades.innerHTML=ups.map(([n,k,c,d])=>`<div class='panel'><b>${n} ${s[k]?'✓':''}</b><div class=small>${d} · ${c} gold</div><button ${s[k]||s.gold<c?'disabled':''} onclick="buy('${k}',${c})">Unlock</button></div>`).join('')}function buy(k,c){if(!s[k]&&s.gold>=c){s.gold-=c;s[k]=1;log('Upgrade unlocked.');render()}}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
